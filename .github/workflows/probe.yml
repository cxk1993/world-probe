name: world-probe
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'   # UTC 23:30 == Beijing 07:30
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run probe
        run: python probe.py
      - name: commit results
        run: |
          git config user.name "ningxi-probe"
          git config user.email "probe@users.noreply.github.com"
          git add -A
          git commit -m "probe $(date -u +%FT%TZ)" || echo "no changes"
          git push
